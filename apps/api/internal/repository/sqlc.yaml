version: "2"
sql:
  - engine: "postgresql"
    queries: "query"
    schema: "../database/migrations"
    gen:
      go:
        package: "repository"
        out: "."
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        emit_enum_valid_method: true
